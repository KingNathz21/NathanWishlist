<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#D71920"><title>Wishlist Admin · Nathan's Wishlist</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="admin.css"></head>
<body class="admin-body"><main class="admin-shell">
<header class="admin-header"><a class="admin-brand" href="index.html">← <span>Nathan's Wishlist</span></a><span class="admin-tag">PRIVATE ADMIN</span></header>
<section id="loginPanel" class="admin-login"><p class="eyebrow">RESTRICTED ACCESS</p><h1>Wishlist <span>admin.</span></h1><p>Sign in with the authorised Google account to manage both collections.</p><button id="googleLogin" class="admin-primary">Continue with Google</button><p id="authMessage" class="admin-message" role="status"></p></section>
<section id="dashboard" hidden><div class="admin-title-row"><div><p class="eyebrow">CONTROL CENTRE</p><h1>Manage your <span>wishlist.</span></h1><p id="signedInAs" class="admin-muted"></p></div><button id="logout" class="admin-secondary">Sign out</button></div>
<div class="admin-toolbar"><div class="admin-tabs"><button class="active" data-list="main">Main Wishlist</button><button data-list="christmas">Christmas Wishlist</button></div><button id="addItem" class="admin-primary">＋ Add item</button></div>
<p id="adminStatus" class="admin-message" role="status"></p><div id="itemsList" class="admin-items"></div>
<form id="itemForm" class="admin-form" hidden><div class="form-heading"><div><p class="eyebrow">ITEM DETAILS</p><h2 id="formTitle">Add an item</h2></div><button type="button" id="closeForm" class="admin-secondary">Close</button></div><input type="hidden" id="itemId">
<div class="admin-fields">
<label>Item name *<input id="name" required maxlength="160"></label><label>Collection<select id="listType"><option value="main">Main Wishlist</option><option value="christmas">Christmas Wishlist</option></select></label>
<label>Wishlist group<input id="wishlist" value="General"></label><label>Category<input id="category" value="Other"></label><label>Brand<input id="brand"></label><label>Store<input id="store"></label><label>Price (£)<input id="price" type="number" min="0" step=".01"></label><label>Quantity<input id="quantity" type="number" min="1" max="99" value="1"></label>
<label>Priority<select id="priority"><option>High</option><option selected>Medium</option><option>Low</option></select></label><label>Date added<input id="dateAdded" type="date"></label><label class="wide">Description<textarea id="description" rows="2"></textarea></label><label class="wide">Notes<textarea id="notes" rows="2"></textarea></label><label class="wide">Image URL<input id="image" type="url" placeholder="https://…"></label><label class="wide">Product link<input id="link" type="url" placeholder="https://…"></label><label class="check-field"><input id="purchased" type="checkbox"> Mark as purchased</label></div><div class="form-actions"><button type="submit" class="admin-primary" id="saveItem">Save item</button></div></form>
</section><p class="admin-foot">Only the authorised Firebase account can access admin actions.</p></main>
<script src="wishlist-firebase-config.js"></script><script type="module" src="admin.js"></script></body></html>
